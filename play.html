<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLAY · HUB Survival Games</title>
  <link id="hub-favicon" rel="icon" type="image/png">
  <script>
    (() => {
      fetch("index.html", { cache: "force-cache" })
        .then((response) => response.text())
        .then((html) => {
          const source = new DOMParser().parseFromString(html, "text/html").querySelector("#hub-favicon");
          const favicon = document.querySelector("#hub-favicon");
          const href = source && source.getAttribute("href");
          if (favicon && href) favicon.setAttribute("href", href);
        })
        .catch(() => {});
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="play.css?v=20260915d">
  <link rel="stylesheet" href="play-fixes.css?v=20260916g">
  <link rel="stylesheet" href="play-rank-update.css?v=20260918a">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="playShell" class="play-shell">
    <header class="play-topbar">
      <a class="hub-button" href="index.html#overview">← HUB</a>
      <div class="play-heading">
        <span>HUB · PLAY</span>
        <strong>BLOXD.IO SURVIVAL GAMES</strong>
      </div>
      <div class="match-chip">
        <span id="modeLabel">SURVIVAL GAMES</span>
        <strong id="roundLabel">KEIN CUP LIVE</strong>
      </div>
    </header>

    <section class="play-layout">
      <div id="gameStage" class="game-stage">
        <iframe
          id="bloxdFrame"
          class="bloxd-frame"
          title="Bloxd Survival Games"
          src="https://bloxd.io/play/classic_playerSchematic%7CHT_Y95VcEQaUBLbTc24H7?lobby=1"
          allow="autoplay; clipboard-read; clipboard-write; pointer-lock"
          scrolling="no"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

        <div class="game-hud">
          <button id="fullscreenButton" class="fullscreen-button" type="button">⛶ VOLLBILD</button>
        </div>

        <section id="roundOverlay" class="round-overlay" hidden>
          <div class="round-card">
            <div class="round-card-head">
              <div>
                <p class="eyebrow">HUB · LIVE CUP</p>
                <h1 id="overlayTitle">RUNDE BEENDET</h1>
                <p id="overlaySubtitle" class="overlay-subtitle">So hat sich der Cup nach dieser Runde verändert.</p>
              </div>
              <span id="overlayRoundChip" class="overlay-round-chip">RUNDE 1</span>
            </div>
            <div id="overlayRanking" class="overlay-ranking"></div>
            <div id="myRatingBlock" class="my-rating" hidden>
              <span>DEIN COMPETITIVE RATING</span>
              <strong id="myRatingValue"></strong>
            </div>
            <button id="closeOverlayButton" class="continue-button" type="button" data-space-label="Leertaste drücken, um fortzufahren" aria-label="Leertaste drücken, um fortzufahren">WEITERSPIELEN</button>
          </div>
        </section>
      </div>

      <aside id="playSidePanel" class="side-panel">
        <div class="side-panel-head">
          <span id="sideEyebrow" class="eyebrow">COMPETITIVE</span>
          <h2 id="sideTitle">DEIN RANG</h2>
          <p id="sideMeta">Live-Daten werden geladen…</p>
        </div>
        <div id="sidePanelContent" class="side-panel-content">
          <div class="side-loading">VERBINDE MIT HUB…</div>
        </div>
      </aside>
    </section>
  </main>

  <div class="modal-backdrop" id="teamDetailModal" hidden>
    <section class="team-detail-modal" role="dialog" aria-modal="true" aria-labelledby="teamDetailTitle">
      <button class="modal-close" type="button" data-close-modal="teamDetailModal" aria-label="Close">×</button>
      <span class="eyebrow">CUP DUO PROFILE</span>
      <h2 id="teamDetailTitle"></h2>
      <div class="team-detail-summary" id="teamDetailSummary"></div>
      <div class="team-player-cards" id="teamPlayerCards"></div>
      <div class="team-round-table-wrap">
        <h3>ROUND BY ROUND</h3>
        <div id="teamRoundTable"></div>
      </div>
    </section>
  </div>

  <script src="play-window-mode.js?v=20260916a"></script>
  <script src="play-presence.js?v=20260916a"></script>
  <script src="play-round-overlay-guard.js?v=20260916a"></script>
  <script src="play.js?v=20260915e"></script>
  <script src="play-ui-runtime.js?v=20260915a"></script>
  <script src="play-round-overlay-upgrade.js?v=20260915e"></script>
  <script src="play-round-overlay-recovery.js?v=20260915a"></script>
  <script src="play-rank-update.js?v=20260918a"></script>
  <script src="map-intros/play-map-intros.js?v=20260916b"></script>
</body>
</html>
