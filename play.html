<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HUB · Survival Games</title>
  <link rel="stylesheet" href="play.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="playShell" class="play-shell">
    <iframe
      id="bloxdFrame"
      class="bloxd-frame"
      title="Bloxd Survival Games"
      src="https://bloxd.io/play/classic_playerSchematic%7CHT_Y95VcEQaUBLbTc24H7?lobby=1"
      allow="autoplay; clipboard-read; clipboard-write; pointer-lock"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <header class="hud-top">
      <a class="hub-button" href="index.html#overview">← HUB</a>
      <div class="match-chip">
        <span id="modeLabel">SURVIVAL GAMES</span>
        <strong id="roundLabel">RUNDE 1</strong>
      </div>
      <button id="fullscreenButton" class="hub-button" type="button">⛶ VOLLBILD</button>
    </header>

    <div id="liveStatus" class="live-status">VERBINDE MIT HUB…</div>

    <section id="roundOverlay" class="round-overlay" hidden>
      <div class="round-card">
        <p class="eyebrow">HUB · LIVE RESULT</p>
        <h1 id="overlayTitle">RUNDE BEENDET</h1>
        <div id="overlayRanking" class="overlay-ranking"></div>
        <div id="myRatingBlock" class="my-rating" hidden>
          <span>DEIN RATING</span>
          <strong id="myRatingValue"></strong>
        </div>
        <button id="closeOverlayButton" class="continue-button" type="button">WEITER</button>
      </div>
    </section>
  </main>

  <script src="play.js"></script>
</body>
</html>
