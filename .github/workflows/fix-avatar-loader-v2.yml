name: Fix avatar persistence and loader v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-avatar-loader-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch index
        run: python .github/scripts/fix_avatar_persistence_loader_v2.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          out=Path('/tmp/hub-scripts-v2');out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body)
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/hub-scripts-v2/*.js; do node --check "$f"; done

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Persist avatars correctly and truly enlarge loader logo'
          git push origin HEAD:main

