name: Test Relay Worker
on:
  push:
    paths:
      - 'relay-worker/**'
      - '.github/workflows/test-relay-worker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: relay-worker/package.json

      - name: Install
        working-directory: relay-worker
        run: npm install

      - name: Syntax and parser tests
        working-directory: relay-worker
        run: |
          node --check src/worker.js
          node --check src/event-parser.js
          node --check src/snapshot-assembler.js
          node test/event-parser.test.js

      - name: Build Docker image
        working-directory: relay-worker
        run: docker build -t bloxd-sg-relay:test .

      - name: Smoke test Docker runtime
        shell: bash
        run: |
          docker run -d --name relay-smoke \
            -e HEADLESS=true \
            -e FORWARD_EVENTS=false \
            -e VERIFY_TIMEOUT_MS=10000 \
            -p 3000:3000 \
            bloxd-sg-relay:test
          trap 'docker logs relay-smoke || true; docker rm -f relay-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health >/tmp/relay-health.json; then
              cat /tmp/relay-health.json
              exit 0
            fi
            sleep 1
          done
          echo 'Relay health endpoint did not become available'
          exit 1
