name: Apply exact Pending HUB shell
on:
  push:
    branches:
      - exact-hub-shell-register-i18n
    paths:
      - '.github/scripts/apply_exact_pending_shell.py'
      - '.github/workflows/apply-exact-pending-shell.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact shell
        run: python3 .github/scripts/apply_exact_pending_shell.py
      - name: Validate standalone pages
        run: |
          node --check pending.js
          node --check pending-shell.js
          node --check register.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pending.html').read_text()
          r=Path('register.html').read_text()
          must_pending=[
            '<header class="site-header">',
            'class="hub-logo" src="data:image/png;base64,',
            'href="index.html#overview"',
            'href="index.html#ranking"',
            'href="index.html#cup"',
            'href="index.html#profile"',
            'hub-shell-shared.css',
            'pending-header-fix.css',
            'pending-shell.js',
            'id="languagePicker"',
            'id="languageButton"',
          ]
          for x in must_pending:
            assert x in p, f'missing Pending requirement: {x}'
          assert '<header class="hub-header">' not in p
          assert 'data-route="profile" class="active"' in p
          for lang in ('de','en','fr'):
            assert f'data-lang="{lang}"' in r, f'missing register language {lang}'
          js=Path('register.js').read_text()
          for marker in ('de:{','en:{','fr:{','hub_language','hubLang'):
            assert marker in js, f'missing registration i18n marker: {marker}'
          print('Pending exact-shell and registration i18n assertions passed')
          PY
      - name: Commit generated shell
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pending.html hub-shell-shared.css
          git diff --cached --quiet || git commit -m "Use exact HUB shell on pending page"
          git push
