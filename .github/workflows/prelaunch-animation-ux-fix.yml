name: Prelaunch animation UX fix
on:
  push:
    paths:
      - '.github/scripts/prelaunch_animation_ux_fix.py'
      - '.github/workflows/prelaunch-animation-ux-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index
        run: python3 .github/scripts/prelaunch_animation_ux_fix.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text()
          for body in re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I):
              if not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False)
              f.write(body);f.close()
              subprocess.run(['node','--check',f.name],check=True)
          PY
      - name: Static audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['HubAnimationUX','showCatchupFinalInstant','missedGames===1?1:missedGames<=3?1.75:missedGames<=6?2.5:3','hub-prelaunch-animation-ux','ANIMATION ÜBERSPRINGEN']
          for x in required:
              assert x in s,x
          print('static assertions passed')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Add adaptive catch-up speed and two-stage continue"
          git push origin HEAD:main
