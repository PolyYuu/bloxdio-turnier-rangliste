name: Probe Bloxd Headless Relay Bind
on:
  push:
    paths:
      - '.github/workflows/probe-bloxd-headless-relay-bind.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Trace deep-link to room join
        shell: bash
        run: |
          cat > trace-join.js <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const invite = `https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`;
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
            });
            const context = await browser.newContext({ viewport: { width: 1365, height: 768 }, locale: 'de-DE' });
            const page = await context.newPage();

            const requests = [];
            const responses = [];
            const consoleLines = [];
            const pageErrors = [];
            const sockets = [];
            let discovery = null;
            let reservation = null;

            const interesting = url => /matchmake|join|classic|playerSchematic|HT_Y95VcEQaUBLbTc24H7|play\//i.test(url);

            page.on('request', req => {
              const url = req.url();
              if (interesting(url) && requests.length < 100) {
                requests.push({ method: req.method(), url: url.slice(0, 500), resourceType: req.resourceType() });
              }
            });

            page.on('response', async response => {
              const url = response.url();
              if (interesting(url) && responses.length < 100) {
                responses.push({ status: response.status(), url: url.slice(0, 500) });
              }
              if (url.includes('/social/bloxd-matchmake')) {
                try {
                  const data = await response.json();
                  discovery = {
                    status: response.status(),
                    succeeded: data && data.succeeded === true,
                    lobbyName: data && data.lobbyName || null,
                    gameNameWithVariation: data && data.gameNameWithVariation || null,
                    gameServerHost: data && data.gameServerHost || null
                  };
                } catch (e) {
                  discovery = { status: response.status(), parseError: String(e) };
                }
              }
              if (/joinOrCreate|reserveSeat|consumeSeatReservation/i.test(url)) {
                try {
                  const data = await response.json();
                  reservation = {
                    status: response.status(),
                    url: url.slice(0, 500),
                    keys: data && typeof data === 'object' ? Object.keys(data) : [],
                    hasSessionId: !!(data && data.sessionId),
                    roomId: data && data.room && data.room.roomId || data && data.roomId || null,
                    processId: data && data.room && data.room.processId || data && data.processId || null,
                    error: data && (data.error || data.message || data.code) || null
                  };
                } catch (_) {
                  reservation = { status: response.status(), url: url.slice(0, 500), nonJson: true };
                }
              }
            });

            page.on('websocket', ws => {
              const item = { url: ws.url(), sent: 0, received: 0, closed: false };
              sockets.push(item);
              ws.on('framesent', () => item.sent++);
              ws.on('framereceived', () => item.received++);
              ws.on('close', () => item.closed = true);
            });

            page.on('console', msg => {
              const text = `[${msg.type()}] ${msg.text()}`;
              if (consoleLines.length < 120 && /play|join|game|match|room|error|fail|lobby|classic/i.test(text)) consoleLines.push(text.slice(0, 800));
            });
            page.on('pageerror', err => {
              if (pageErrors.length < 40) pageErrors.push(String(err && err.stack || err).slice(0, 1200));
            });

            console.log('requestedInvite=', invite);
            const nav = await page.goto(invite, { waitUntil: 'domcontentloaded', timeout: 90000 });
            console.log('initialNavigationStatus=', nav && nav.status());
            console.log('urlAfterGoto=', page.url());

            await page.waitForTimeout(5000);
            console.log('urlAfter5s=', page.url());

            const snap1 = await page.evaluate(worldId => {
              const all = [...document.querySelectorAll('a,button,[role="button"],input')];
              const controls = all.map((el, i) => ({
                i,
                tag: el.tagName,
                text: (el.innerText || el.value || '').trim().slice(0, 160),
                href: el.href || null,
                placeholder: el.getAttribute('placeholder'),
                aria: el.getAttribute('aria-label'),
                visible: !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)
              })).filter(x => x.visible && (/play|join|enter|start|lobby|game/i.test(`${x.text} ${x.href || ''} ${x.placeholder || ''} ${x.aria || ''}`) || (x.href || '').includes(worldId))).slice(0, 80);

              const storage = {};
              try { storage.local = Object.fromEntries(Object.keys(localStorage).map(k => [k, String(localStorage.getItem(k)).slice(0, 500)])); } catch (_) {}
              try { storage.session = Object.fromEntries(Object.keys(sessionStorage).map(k => [k, String(sessionStorage.getItem(k)).slice(0, 500)])); } catch (_) {}

              return {
                title: document.title,
                locationHref: location.href,
                historyState: history.state,
                controls,
                bodyHead: (document.body && (document.body.innerText || document.body.textContent) || '').slice(0, 1800),
                bodyTail: (document.body && (document.body.innerText || document.body.textContent) || '').slice(-1800),
                storage
              };
            }, worldId);

            console.log('discovery=', JSON.stringify(discovery));
            console.log('reservationAfter5s=', JSON.stringify(reservation));
            console.log('socketsAfter5s=', JSON.stringify(sockets));
            console.log('controlsAfter5s=', JSON.stringify(snap1.controls));
            console.log('historyState=', JSON.stringify(snap1.historyState));
            console.log('localStorageKeys=', JSON.stringify(Object.keys(snap1.storage.local || {})));
            console.log('sessionStorageKeys=', JSON.stringify(Object.keys(snap1.storage.session || {})));
            console.log('bodyHead=', JSON.stringify(snap1.bodyHead));

            // If Bloxd exposed a concrete visible Play/Join/Enter control, click the most relevant one.
            const candidates = page.locator('a,button,[role="button"]');
            const count = await candidates.count();
            let clicked = null;
            for (let i = 0; i < Math.min(count, 250); i++) {
              const el = candidates.nth(i);
              let visible = false;
              try { visible = await el.isVisible(); } catch (_) {}
              if (!visible) continue;
              let text = '';
              let href = '';
              try { text = (await el.innerText()).trim(); } catch (_) {}
              try { href = await el.getAttribute('href') || ''; } catch (_) {}
              const hay = `${text} ${href}`;
              if ((href && href.includes(worldId)) || /^(play|join|enter game|start)$/i.test(text) || /join.*game|enter.*game/i.test(text)) {
                try {
                  await el.click({ force: true, timeout: 3000 });
                  clicked = { i, text: text.slice(0, 120), href: href.slice(0, 300) };
                  break;
                } catch (_) {}
              }
            }
            console.log('clickedControl=', JSON.stringify(clicked));

            if (!clicked) {
              // Also test the deep link once with a raw pipe. Chromium will normalize it if appropriate.
              const rawInvite = `https://bloxd.io/play/classic_playerSchematic|${worldId}?lobby=1`;
              console.log('tryingRawInvite=', rawInvite);
              await page.goto(rawInvite, { waitUntil: 'domcontentloaded', timeout: 90000 });
            }

            await page.waitForTimeout(12000);

            console.log('finalUrl=', page.url());
            console.log('finalDiscovery=', JSON.stringify(discovery));
            console.log('finalReservation=', JSON.stringify(reservation));
            console.log('finalSockets=', JSON.stringify(sockets));
            console.log('interestingRequests=', JSON.stringify(requests));
            console.log('interestingResponses=', JSON.stringify(responses));
            console.log('consoleSignals=', JSON.stringify(consoleLines));
            console.log('pageErrors=', JSON.stringify(pageErrors));

            const finalState = await page.evaluate(() => ({
              body: (document.body && (document.body.innerText || document.body.textContent) || '').slice(-3500),
              inputs: [...document.querySelectorAll('input,textarea')].map(el => ({
                type: el.getAttribute('type'),
                placeholder: el.getAttribute('placeholder'),
                value: String(el.value || '').slice(0, 120),
                visible: !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)
              })).filter(x => x.visible).slice(0, 30)
            }));
            console.log('finalVisibleInputs=', JSON.stringify(finalState.inputs));
            console.log('finalBodyTail=', JSON.stringify(finalState.body));

            await browser.close();

            if (!discovery || !discovery.succeeded) process.exit(2);
            if (!reservation || !reservation.hasSessionId) process.exit(3);
            if (!sockets.length) process.exit(4);
            console.log('ROOM_JOIN_TRANSITION_OK=true');
          })().catch(err => {
            console.error('traceFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node trace-join.js
