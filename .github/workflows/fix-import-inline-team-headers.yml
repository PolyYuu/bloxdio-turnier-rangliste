name: Fix import inline team headers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-import-inline-team-headers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch import parser
        run: python .github/scripts/fix_import_inline_team_headers.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          out=Path('/tmp/hub-import-inline-scripts');out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body)
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/hub-import-inline-scripts/*.js; do node --check "$f"; done
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Accept inline team headers in round import'
          git push origin HEAD:main
