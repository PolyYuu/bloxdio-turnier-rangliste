name: Patch Live Sync Production Control V2
on:
  push:
    paths:
      - '.github/workflows/patch-live-sync-production-control-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/patch_live_sync_production.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re,subprocess,pathlib,sys
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          print('inline scripts:',len(blocks))
          for i,code in enumerate(blocks):
              if not code.strip(): continue
              fn=f'/tmp/hub-script-{i}.js'
              pathlib.Path(fn).write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',fn],capture_output=True,text=True)
              if r.returncode:
                  print('FAILED SCRIPT',i)
                  print(r.stderr)
                  sys.exit(r.returncode)
          print('all inline JavaScript parses')
          PY
      - name: Commit production control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Add guarded Live Sync production controls"
          git push
