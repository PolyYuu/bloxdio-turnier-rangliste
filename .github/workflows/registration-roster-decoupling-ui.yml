name: Registration roster decoupling UI
on:
  push:
    paths:
      - '.github/scripts/registration_roster_decoupling_ui.py'
      - '.github/workflows/registration-roster-decoupling-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index
        run: python3 .github/scripts/registration_roster_decoupling_ui.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text()
          for body in re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I):
              if not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(body);f.close()
              subprocess.run(['node','--check',f.name],check=True)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Decouple registration overview from tournament roster"
          git push origin HEAD:main
