name: Offline catch-up and registration export fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-catchup-registration-export.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/offline_catchup_registration_export_fix.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          out=Path('/tmp/hub-catchup-scripts');out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body)
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/hub-catchup-scripts/*.js; do node --check "$f"; done
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add persistent catch-up animations and registration export'
          git push origin HEAD:main
