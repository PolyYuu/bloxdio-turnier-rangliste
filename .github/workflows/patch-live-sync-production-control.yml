name: Patch Live Sync Production Control
on:
  push:
    paths:
      - '.github/workflows/patch-live-sync-production-control.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Add API methods.
          api_marker="  async function adminRemoveBloxdSyncBinding(tournamentId) { return rpc('admin_remove_bloxd_sync_binding',{p_tournament_id:tournamentId}); }"
          if s.count(api_marker)!=1:
              raise SystemExit(f'API marker count {s.count(api_marker)}')
          api_add=api_marker+"\n  async function adminGetBloxdAutoFinalize(tournamentId) { return rpc('admin_get_bloxd_auto_finalize',{p_tournament_id:tournamentId}); }\n  async function adminSetBloxdAutoFinalize(tournamentId,enabled) { return rpc('admin_set_bloxd_auto_finalize',{p_tournament_id:tournamentId,p_enabled:!!enabled}); }\n  async function adminGetBloxdProductionHealth(tournamentId) { return rpc('admin_get_bloxd_production_health',{p_tournament_id:tournamentId}); }\n  async function adminAbortBloxdLiveMatch(tournamentId,force=false) { return rpc('admin_abort_bloxd_live_match',{p_tournament_id:tournamentId,p_force:!!force}); }"
          s=s.replace(api_marker,api_add,1)

          # 2) Expose API methods in HubAPI return object.
          ret_marker="adminGetBloxdRelayEvents,adminGetBloxdRelayStatus,adminGetBloxdSyncBinding,adminUpsertBloxdSyncBinding,adminRemoveBloxdSyncBinding,subscribeToBloxdRelay"
          if s.count(ret_marker)!=1:
              raise SystemExit(f'return marker count {s.count(ret_marker)}')
          ret_add="adminGetBloxdRelayEvents,adminGetBloxdRelayStatus,adminGetBloxdSyncBinding,adminUpsertBloxdSyncBinding,adminRemoveBloxdSyncBinding,adminGetBloxdAutoFinalize,adminSetBloxdAutoFinalize,adminGetBloxdProductionHealth,adminAbortBloxdLiveMatch,subscribeToBloxdRelay"
          s=s.replace(ret_marker,ret_add,1)

          # 3) Replace only openBloxdSyncConfig.
          start=s.find("  async function openBloxdSyncConfig(cup){")
          end=s.find("\n\n  function ensureAdminSafetyTools(cup){",start)
          if start<0 or end<0:
              raise SystemExit('openBloxdSyncConfig boundaries not found')
          new_fn=r'''  async function openBloxdSyncConfig(cup){
    if(!cup)return;
    let binding=null,autoFinalize=false,health=null;
    try{
      const values=await Promise.all([
        api.adminGetBloxdSyncBinding(cup.id),
        api.adminGetBloxdAutoFinalize(cup.id),
        api.adminGetBloxdProductionHealth(cup.id)
      ]);
      binding=(values[0]||[])[0]||null;
      const auto=values[1];
      autoFinalize=Array.isArray(auto)?!!auto[0]?.enabled:!!(auto?.enabled??auto);
      health=values[2]||null;
    }catch(e){return toast(e.message||String(e),true);}
    const suggested=binding?.sync_key||`cup-${String(cup.id).slice(0,8)}`;
    const relayOnline=!!health?.relay?.online;
    const match=health?.match||null;
    const snapshot=health?.snapshot||null;
    const snapStatus=String(snapshot?.validationStatus||'—').toUpperCase();
    const recoveryStatus=String(snapshot?.recoveryStatus||'—').toUpperCase();
    const finalizeStatus=String(snapshot?.autoFinalizeStatus||'—').toUpperCase();
    const running=match?.status==='running';
    const canAbort=running&&!relayOnline;
    const healthClass=health?.needsAttention?'attention':health?.ready?'ready':'idle';
    const healthLabel=health?.needsAttention?copy('ATTENTION REQUIRED','PRÜFUNG NÖTIG','VÉRIFICATION REQUISE'):health?.ready?copy('READY','BEREIT','PRÊT'):copy('NOT READY','NICHT BEREIT','NON PRÊT');
    const m=document.createElement('div');m.className='v3-modal-backdrop';
    m.innerHTML=`<section class="v3-modal v3-live-sync-modal"><button class="modal-close" data-v3-close>×</button><span class="eyebrow">BLOXD · LIVE SYNC · PRODUCTION CONTROL</span><h2>${copy('Live Sync control','Live Sync steuern','Contrôle Live Sync')}</h2><p>${copy('Bloxd events update participants, teams and round results live. The final snapshot validates the round, can repair missing live events, and may finalize rating only when Auto-Finalize is enabled for this Cup.','Bloxd-Events aktualisieren Teilnehmer, Teams und Rundenergebnisse live. Der Final Snapshot prüft die Runde, kann fehlende Live-Events reparieren und darf Rating nur finalisieren, wenn Auto-Finalize für diesen Cup aktiviert ist.','Les événements Bloxd mettent à jour le Cup en direct. Le snapshot final valide et peut réparer la manche; le rating n’est finalisé automatiquement que si cette option est activée.')}</p>
      <div class="v3-live-health ${healthClass}"><div class="v3-live-health-head"><span>${copy('Production health','Produktionsstatus','État production')}</span><strong>${healthLabel}</strong></div><div class="v3-live-health-grid">
        <article><span>RELAY</span><b class="${relayOnline?'ok':'bad'}">${relayOnline?'ONLINE':'OFFLINE'}</b><small>${health?.relay?.lastSeenAt?`${copy('Last contact','Letzter Kontakt','Dernier contact')}: ${relayAgeText(health.relay.lastSeenAt)}`:'—'}</small></article>
        <article><span>MATCH</span><b>${match?`${String(match.status||'—').toUpperCase()} · R${Number(match.round||0)}`:'—'}</b><small>${esc(match?.map||copy('No match yet','Noch kein Match','Aucun match'))}</small></article>
        <article><span>SNAPSHOT</span><b class="${snapStatus==='MATCHED'?'ok':snapStatus==='MISMATCH'?'bad':''}">${esc(snapStatus)}</b><small>${snapshot?`${copy('Recovery','Recovery','Récupération')}: ${esc(recoveryStatus)}`:'—'}</small></article>
        <article><span>AUTO FINALIZE</span><b class="${autoFinalize?'ok':''}">${autoFinalize?'ON':'OFF'}</b><small>${snapshot?`${copy('Last','Zuletzt','Dernier')}: ${esc(finalizeStatus)}`:copy('No snapshot yet','Noch kein Snapshot','Aucun snapshot')}</small></article>
      </div>${health?.needsAttention?`<div class="v3-live-health-warning">⚠ ${copy('Reason','Grund','Raison')}: ${esc(String(health.attentionReason||'unknown').replace(/_/g,' '))}</div>`:''}</div>
      <div class="v3-live-sync-state ${binding?.is_enabled?'enabled':'disabled'}"><span>${copy('Current connection','Aktuelle Verbindung','Connexion actuelle')}</span><strong>${binding?.is_enabled?'SYNC ENABLED':copy('Not connected','Nicht verbunden','Non connecté')}</strong>${binding?.live_match_id?`<small>${copy('Running','Läuft','En cours')}: ${esc(binding.live_match_id)} · ${copy('Round','Runde','Manche')} ${Number(binding.live_round||0)}${binding.live_map_name?` · ${esc(binding.live_map_name)}`:''}</small>`:`<small>${copy('No active Bloxd match is linked to this Cup.','Kein aktives Bloxd-Match ist mit diesem Cup verbunden.','Aucun match actif lié.')}</small>`}</div>
      <form id="v3LiveSyncForm"><label><span>SYNC KEY</span><div class="v3-live-sync-copy"><input name="syncKey" id="v3LiveSyncKey" value="${esc(suggested)}" maxlength="120" pattern="[A-Za-z0-9._:-]{3,120}" required><button class="ghost-button" type="button" id="v3CopySyncKey">${copy('Copy','Kopieren','Copier')}</button></div><small>${copy('Use exactly this value in the World Code / relay binding. It is not a password.','Genau diesen Wert für die World-Code-/Relay-Bindung verwenden. Er ist kein Passwort.','Utilise exactement cette valeur dans le World Code / relais.')}</small></label>
      <label><span>RELAY ID <small>(${copy('optional','optional','optionnel')})</small></span><input name="relayId" value="${esc(binding?.relay_id||'')}" maxlength="120" placeholder="malik-main-relay"><small>${copy('Leave empty to accept this Sync Key from any authorized relay.','Leer lassen, damit dieser Sync Key von jedem autorisierten Relay akzeptiert wird.','Laisser vide pour tout relais autorisé.')}</small></label>
      <label class="v3-live-sync-toggle"><input type="checkbox" name="enabled" ${binding?.is_enabled!==false?'checked':''}><span>${copy('Enable Live Sync for this Cup','Live Sync für diesen Cup aktivieren','Activer Live Sync pour ce Cup')}</span></label>
      <label class="v3-live-sync-toggle v3-auto-finalize-toggle"><input type="checkbox" name="autoFinalize" ${autoFinalize?'checked':''}><span><b>${copy('Enable guarded Auto-Finalize','Geschütztes Auto-Finalize aktivieren','Activer Auto-Finalize sécurisé')}</b><small>${copy('Rating is finalized only after an ended match and a complete MATCHED snapshot. Recovery runs first if needed.','Rating wird nur nach beendetem Match und vollständigem MATCHED-Snapshot finalisiert. Falls nötig läuft vorher Recovery.','Le rating est finalisé uniquement après un match terminé et un snapshot MATCHED complet.')}</small></span></label>
      <div class="v3-form-error" id="v3LiveSyncErr"></div><div class="v3-live-sync-actions"><button class="cta-button" type="submit">${copy('Save Production Settings','Produktions-Einstellungen speichern','Enregistrer')}</button><button class="ghost-button" type="button" id="v3OpenLiveDebug">LIVE DEBUG</button>${canAbort?`<button class="ghost-button danger" type="button" id="v3AbortStaleMatch">${copy('Abort stale match','Stales Match abbrechen','Annuler le match bloqué')}</button>`:''}${binding?`<button class="ghost-button danger" type="button" id="v3RemoveLiveSync">${copy('Disconnect','Verbindung entfernen','Déconnecter')}</button>`:''}</div></form></section>`;
    document.body.appendChild(m);
    const close=()=>m.remove();m.onclick=e=>{if(e.target===m||e.target.closest('[data-v3-close]'))close();};
    $('#v3CopySyncKey',m).onclick=async()=>{const input=$('#v3LiveSyncKey',m);try{await navigator.clipboard.writeText(input.value);toast(copy('Sync Key copied.','Sync Key kopiert.','Sync Key copié.'));}catch(_){input.select();document.execCommand('copy');toast(copy('Sync Key copied.','Sync Key kopiert.','Sync Key copié.'));}};
    $('#v3OpenLiveDebug',m).onclick=()=>{close();location.hash='#live-debug';};
    const abort=$('#v3AbortStaleMatch',m);if(abort)abort.onclick=async()=>{if(!confirm(copy('The relay is offline while a match is still marked as running. Abort this exact match and roll back its live stats? Rating will not be touched.','Der Relay ist offline, obwohl das Match noch als laufend markiert ist. Dieses exakte Match abbrechen und seine Live-Stats zurückrollen? Rating wird nicht angefasst.','Le relais est hors ligne alors que le match est encore actif. Annuler ce match précis ?')))return;abort.disabled=true;try{const result=await api.adminAbortBloxdLiveMatch(cup.id,false);if(result?.aborted){toast(copy('Stale match aborted safely.','Stales Match sicher abgebrochen.','Match bloqué annulé.'));close();}else{toast(copy('Match was not aborted: ','Match wurde nicht abgebrochen: ','Match non annulé : ')+(result?.reason||result?.status||'unknown'),true);abort.disabled=false;}}catch(e){toast(e.message||String(e),true);abort.disabled=false;}};
    const remove=$('#v3RemoveLiveSync',m);if(remove)remove.onclick=async()=>{if(!confirm(copy('Disconnect this Cup from Bloxd Live Sync? Incoming events will still be stored, but they will no longer change this Cup.','Diesen Cup wirklich vom Bloxd Live Sync trennen? Events werden weiterhin gespeichert, verändern diesen Cup aber nicht mehr.','Déconnecter ce Cup ?')))return;remove.disabled=true;try{await api.adminSetBloxdAutoFinalize(cup.id,false);await api.adminRemoveBloxdSyncBinding(cup.id);toast(copy('Live Sync disconnected.','Live Sync getrennt.','Live Sync déconnecté.'));close();}catch(e){toast(e.message||String(e),true);remove.disabled=false;}};
    $('#v3LiveSyncForm',m).onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),key=String(f.get('syncKey')||'').trim(),relay=String(f.get('relayId')||'').trim(),enabled=f.get('enabled')==='on',auto=f.get('autoFinalize')==='on',submit=e.submitter,err=$('#v3LiveSyncErr',m);err.textContent='';submit.disabled=true;try{await api.adminUpsertBloxdSyncBinding(cup.id,key,relay||null,enabled);await api.adminSetBloxdAutoFinalize(cup.id,auto);toast(copy('Production settings saved.','Produktions-Einstellungen gespeichert.','Paramètres enregistrés.'));close();}catch(ex){err.textContent=ex.message||String(ex);submit.disabled=false;}};
  }'''
          s=s[:start]+new_fn+s[end:]

          # 4) Update outdated Live Debug copy only.
          replacements={
            "Safe relay diagnostics. Phase 4 processes bound participants, teams, kills, Deathmatch, wins and round end live; placement and rating still require explicit finalization.":"Production relay diagnostics. Live results are validated by the final snapshot, repaired when needed, and rating may auto-finalize only for Cups with guarded Auto-Finalize enabled.",
            "Sichere Relay-Diagnose. Phase 4 verarbeitet gebundene Teilnehmer, Teams, Kills, Deathmatch, Siege und Rundenende live; Placement und Rating benötigen weiterhin ein ausdrückliches Finalisieren.":"Produktions-Diagnose für den Relay. Live-Ergebnisse werden durch den Final Snapshot geprüft, bei Bedarf repariert und Rating darf nur bei Cups mit aktiviertem geschützten Auto-Finalize automatisch finalisiert werden.",
            "PHASE 4 · LIVE RESULTS":"PRODUCTION · GUARDED AUTO-FINALIZE",
            "Bound live events may update participants, teams, kills, Deathmatch, wins and round results. Placement, Ranked Games and rating only change after explicit rating finalization.":"Bound live events update round results. A complete MATCHED snapshot is required before guarded Auto-Finalize can change Placement, Ranked Games or rating.",
            "Gebundene Live-Events dürfen Teilnehmer, Teams, Kills, Deathmatch, Siege und Rundenergebnisse aktualisieren. Placement, Ranked Games und Rating ändern sich erst nach dem ausdrücklichen Rating-Finalisieren.":"Gebundene Live-Events aktualisieren Rundenergebnisse. Erst ein vollständiger MATCHED-Snapshot darf bei aktiviertem geschützten Auto-Finalize Placement, Ranked Games oder Rating verändern."
          }
          for a,b in replacements.items():
              n=s.count(a)
              if n!=1: raise SystemExit(f'copy marker count {n}: {a[:55]}')
              s=s.replace(a,b,1)

          # 5) Add focused CSS before the existing Phase2 style end.
          style_start=s.find('<style id="hub-bloxd-phase2-admin-style">')
          style_end=s.find('</style>',style_start)
          if style_start<0 or style_end<0: raise SystemExit('live sync style block not found')
          css=r'''
.v3-live-health{display:grid;gap:10px;margin:14px 0;padding:14px;border:1px solid rgba(126,101,190,.3);border-radius:12px;background:rgba(255,255,255,.02)}.v3-live-health.ready{border-color:rgba(65,225,169,.32);background:rgba(65,225,169,.045)}.v3-live-health.attention{border-color:rgba(255,113,137,.35);background:rgba(255,113,137,.045)}.v3-live-health-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.v3-live-health-head span{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#8f879f}.v3-live-health-head strong{font-size:11px}.v3-live-health.ready .v3-live-health-head strong{color:#62f2ad}.v3-live-health.attention .v3-live-health-head strong{color:#ff7189}.v3-live-health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.v3-live-health-grid article{display:grid;gap:3px;padding:10px 11px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(126,101,190,.16)}.v3-live-health-grid article span{font-size:8px;font-weight:900;letter-spacing:.08em;color:#80778d}.v3-live-health-grid article b{font-size:11px;color:#d6cfdf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v3-live-health-grid article b.ok{color:#62f2ad}.v3-live-health-grid article b.bad{color:#ff7189}.v3-live-health-grid article small{font-size:8px;color:#756d80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v3-live-health-warning{padding:8px 9px;border-radius:8px;background:rgba(255,113,137,.08);color:#ff9aac;font-size:9px}.v3-auto-finalize-toggle{margin-top:2px;padding:10px 11px;border:1px solid rgba(255,198,92,.22);border-radius:9px;background:rgba(255,198,92,.035)}.v3-auto-finalize-toggle>span{display:grid;gap:3px!important}.v3-auto-finalize-toggle b{color:#ffc65c}.v3-auto-finalize-toggle small{font-weight:500!important;color:#8c8295!important;line-height:1.4}@media(max-width:620px){.v3-live-health-grid{grid-template-columns:1fr}}
'''
          s=s[:style_end]+css+s[style_end:]

          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re,subprocess,tempfile,pathlib,sys
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          print('inline scripts:',len(blocks))
          for i,code in enumerate(blocks):
              if not code.strip(): continue
              fn=f'/tmp/hub-script-{i}.js'
              pathlib.Path(fn).write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',fn],capture_output=True,text=True)
              if r.returncode:
                  print('FAILED SCRIPT',i)
                  print(r.stderr)
                  sys.exit(r.returncode)
          print('all inline JavaScript parses')
          PY
      - name: Commit production control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Add guarded Live Sync production controls"
          git push
