name: Extract current HUB shell
on:
  push:
    branches:
      - exact-hub-shell-register-i18n
    paths:
      - '.github/scripts/extract_current_hub_shell.py'
      - '.github/workflows/extract-current-hub-shell.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current HUB shell
        run: python3 .github/scripts/extract_current_hub_shell.py
      - name: Commit extract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hub-shell-extract.txt
          git diff --cached --quiet || git commit -m "Extract current HUB shell"
          git push
