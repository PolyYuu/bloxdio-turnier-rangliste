name: Inspect Live Sync Admin
on:
  push:
    paths:
      - '.github/workflows/inspect-live-sync-admin.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print live sync contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pats=['LIVE SYNC','live-sync','bloxd','adminGetBloxd','adminUpsertBloxd','syncKey','data-live']
          seen=[]
          for p in pats:
              start=0
              while True:
                  i=s.lower().find(p.lower(),start)
                  if i<0: break
                  if all(abs(i-x)>500 for x in seen):
                      seen.append(i)
                      print('\n===',p,'@',i,'===')
                      print(s[max(0,i-1400):min(len(s),i+3200)])
                  start=i+1
          print('\nTOTAL MATCHES',len(seen))
          PY
