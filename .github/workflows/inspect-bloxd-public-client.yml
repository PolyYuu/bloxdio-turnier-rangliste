name: Inspect Bloxd Public Client
on:
  push:
    paths:
      - '.github/workflows/inspect-bloxd-public-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Resolve module 69 compliance export
        shell: bash
        run: |
          cat > inspect-client.js <<'JS'
          const { chromium } = require('playwright');

          function safe(text) {
            return String(text || '').replace(/[A-Za-z0-9_-]{120,}/g, '[LONG_LITERAL]');
          }

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            const scripts = [];

            page.on('response', async response => {
              const req = response.request();
              const url = response.url();
              if (req.resourceType() !== 'script' && !/\.js(?:\?|$)/i.test(url)) return;
              if (!/bloxd\.io/i.test(url)) return;
              let text = '';
              try { text = await response.text(); } catch (_) { return; }
              if (text) scripts.push({ url, text });
            });

            await page.goto(`https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`, {
              waitUntil: 'domcontentloaded', timeout: 90000
            });
            await page.waitForTimeout(10000);

            const hits = [];
            const patterns = [
              /(?:^|[,\{])69:function\s*\([^)]*\)\s*\{/g,
              /(?:^|[,\{])69:\s*\([^)]*\)\s*=>\s*\{/g,
              /(?:^|[,\{])69:\s*[^,]{0,120}=>\s*\{/g
            ];

            for (const script of scripts) {
              for (const re of patterns) {
                re.lastIndex = 0;
                let m;
                while ((m = re.exec(script.text)) !== null) {
                  hits.push({
                    script: script.url.split('/').pop(),
                    pos: m.index,
                    context: safe(script.text.slice(Math.max(0, m.index - 500), Math.min(script.text.length, m.index + 10000)))
                  });
                  if (hits.length >= 8) break;
                }
                if (hits.length >= 8) break;
              }
              if (hits.length >= 8) break;
            }

            console.log('module69DefCount=', hits.length);
            for (const hit of hits) {
              console.log('MODULE69_START');
              console.log('script=', hit.script);
              console.log('pos=', hit.pos);
              console.log('context=', hit.context);
              console.log('MODULE69_END');
            }

            // Also inspect exact imports in the connect module to verify the alias mapping.
            for (const script of scripts) {
              const pos = script.text.indexOf('24689:');
              if (pos === -1) continue;
              console.log('CONNECT_MODULE_START');
              console.log('script=', script.url.split('/').pop());
              console.log('context=', safe(script.text.slice(pos, Math.min(script.text.length, pos + 9000))));
              console.log('CONNECT_MODULE_END');
              break;
            }

            await browser.close();
            if (!hits.length) process.exit(4);
          })().catch(err => {
            console.error('inspectFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node inspect-client.js
