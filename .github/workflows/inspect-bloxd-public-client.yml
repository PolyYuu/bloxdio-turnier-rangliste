name: Inspect Bloxd Public Client
on:
  push:
    paths:
      - '.github/workflows/inspect-bloxd-public-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Trace trafficCode and compliance sources
        shell: bash
        run: |
          cat > inspect-client.js <<'JS'
          const { chromium } = require('playwright');

          function safe(text) {
            return String(text || '').replace(/[A-Za-z0-9_-]{120,}/g, '[LONG_LITERAL]');
          }

          function allIndexes(text, needle, max = 30) {
            const out = [];
            let from = 0;
            while (out.length < max) {
              const pos = text.indexOf(needle, from);
              if (pos === -1) break;
              out.push(pos);
              from = pos + needle.length;
            }
            return out;
          }

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            const scripts = [];

            page.on('response', async response => {
              const req = response.request();
              const url = response.url();
              if (req.resourceType() !== 'script' && !/\.js(?:\?|$)/i.test(url)) return;
              if (!/bloxd\.io/i.test(url)) return;
              let text = '';
              try { text = await response.text(); } catch (_) { return; }
              if (text) scripts.push({ url, text });
            });

            await page.goto(`https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`, {
              waitUntil: 'domcontentloaded',
              timeout: 90000
            });
            await page.waitForTimeout(12000);

            console.log('scriptCount=', scripts.length);

            const needles = ['trafficCode', 'compliance', 'EQ(110)', 'connectToServer(', '.connectToServer('];
            for (const needle of needles) {
              let total = 0;
              console.log('TRACE_GROUP_START=', needle);
              for (const script of scripts) {
                const positions = allIndexes(script.text, needle, 20);
                for (const pos of positions) {
                  total++;
                  console.log('TRACE_START');
                  console.log('needle=', needle);
                  console.log('script=', script.url.split('/').pop());
                  console.log('pos=', pos);
                  console.log('context=', safe(script.text.slice(Math.max(0, pos - 3500), Math.min(script.text.length, pos + 5000))));
                  console.log('TRACE_END');
                  if (total >= 20) break;
                }
                if (total >= 20) break;
              }
              console.log('TRACE_COUNT=', needle, total);
              console.log('TRACE_GROUP_END=', needle);
            }

            // Find explicit module definitions for 110 in object-style chunks, if present.
            const module110Defs = [];
            const defPatterns = [
              /(?:^|[,\{])110:\s*function\s*\([^)]*\)\s*\{/g,
              /(?:^|[,\{])110:\s*\([^)]*\)\s*=>\s*\{/g,
              /(?:^|[,\{])110:\s*[^,]{0,120}=>\s*\{/g
            ];
            for (const script of scripts) {
              for (const re of defPatterns) {
                re.lastIndex = 0;
                let m;
                while ((m = re.exec(script.text)) !== null) {
                  module110Defs.push({
                    script: script.url.split('/').pop(),
                    pos: m.index,
                    context: safe(script.text.slice(Math.max(0, m.index - 500), Math.min(script.text.length, m.index + 4500)))
                  });
                  if (module110Defs.length >= 10) break;
                }
                if (module110Defs.length >= 10) break;
              }
              if (module110Defs.length >= 10) break;
            }
            console.log('module110DefCount=', module110Defs.length);
            for (const hit of module110Defs) {
              console.log('MODULE110_START');
              console.log('script=', hit.script);
              console.log('pos=', hit.pos);
              console.log('context=', hit.context);
              console.log('MODULE110_END');
            }

            await browser.close();
          })().catch(err => {
            console.error('inspectFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node inspect-client.js
