name: Inspect Bloxd Public Client
on:
  push:
    paths:
      - '.github/workflows/inspect-bloxd-public-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Inspect public traffic-code cache logic
        shell: bash
        run: |
          cat > inspect-client.js <<'JS'
          const { chromium } = require('playwright');

          function safe(text) {
            return String(text || '').replace(/[A-Za-z0-9_-]{120,}/g, '[LONG_LITERAL]');
          }

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            const scripts = [];

            page.on('response', async response => {
              const req = response.request();
              const url = response.url();
              if (req.resourceType() !== 'script' && !/\.js(?:\?|$)/i.test(url)) return;
              if (!/bloxd\.io/i.test(url)) return;
              let text = '';
              try { text = await response.text(); } catch (_) { return; }
              if (text) scripts.push({ url, text });
            });

            await page.goto(`https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(10000);

            const needles = ['trafficCode_b_until', 'trafficCode_', '/index/traffic-code', 'Obtaining traffic code', 'Obtained traffic code'];
            let hitCount = 0;
            for (const needle of needles) {
              for (const script of scripts) {
                let from = 0;
                let perNeedle = 0;
                while (perNeedle < 12) {
                  const pos = script.text.indexOf(needle, from);
                  if (pos === -1) break;
                  hitCount++;
                  perNeedle++;
                  console.log('CACHE_TRACE_START');
                  console.log('needle=', needle);
                  console.log('script=', script.url.split('/').pop());
                  console.log('pos=', pos);
                  console.log('context=', safe(script.text.slice(Math.max(0, pos - 4500), Math.min(script.text.length, pos + 6500))));
                  console.log('CACHE_TRACE_END');
                  from = pos + needle.length;
                }
              }
            }

            console.log('trafficCacheTraceCount=', hitCount);
            await browser.close();
            if (!hitCount) process.exit(4);
          })().catch(err => {
            console.error('inspectFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node inspect-client.js
