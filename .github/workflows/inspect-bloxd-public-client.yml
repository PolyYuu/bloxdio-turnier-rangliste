name: Inspect Bloxd Public Client
on:
  push:
    paths:
      - '.github/workflows/inspect-bloxd-public-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Read public Webpack module 44
        shell: bash
        run: |
          cat > inspect-client.js <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();

            await page.goto(`https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`, {
              waitUntil: 'domcontentloaded',
              timeout: 90000
            });
            await page.waitForTimeout(10000);

            const result = await page.evaluate(() => {
              const chunkGlobals = Object.keys(window).filter(k => /^webpackChunk/.test(k));
              const out = {
                chunkGlobals,
                captured: false,
                module44Present: false,
                exportKeys: [],
                primitiveExports: {},
                module44SourcePrefix: null,
                error: null
              };

              if (!chunkGlobals.length) {
                out.error = 'No webpackChunk global found';
                return out;
              }

              let req = null;
              for (const key of chunkGlobals) {
                try {
                  const arr = window[key];
                  if (!Array.isArray(arr) || typeof arr.push !== 'function') continue;
                  const syntheticId = 900000 + Math.floor(Math.random() * 90000);
                  arr.push([[syntheticId], {}, r => { req = r; }]);
                  if (req) break;
                } catch (_) {}
              }

              if (!req) {
                out.error = 'Could not capture webpack require';
                return out;
              }

              out.captured = true;
              out.module44Present = !!(req.m && req.m[44]);
              if (req.m && req.m[44]) {
                try {
                  out.module44SourcePrefix = String(req.m[44]).slice(0, 2000);
                } catch (_) {}
              }

              try {
                const mod = req(44);
                if (mod && (typeof mod === 'object' || typeof mod === 'function')) {
                  out.exportKeys = Object.keys(mod).slice(0, 50);
                  for (const key of out.exportKeys) {
                    try {
                      const value = mod[key];
                      if (
                        typeof value === 'string' ||
                        typeof value === 'number' ||
                        typeof value === 'boolean' ||
                        value === null
                      ) {
                        out.primitiveExports[key] = value;
                      }
                    } catch (_) {}
                  }
                }
              } catch (err) {
                out.error = `require(44): ${String(err && err.message || err)}`;
              }

              return out;
            });

            // Module 44 is public client code. Log only short source prefix and primitive exports.
            if (result.module44SourcePrefix) {
              result.module44SourcePrefix = result.module44SourcePrefix
                .replace(/[A-Za-z0-9_-]{120,}/g, '[LONG_LITERAL]');
            }
            console.log('webpackRuntimeResult=', JSON.stringify(result));
            console.log('CLIENT_VERSION_EXPORT_D=', Object.prototype.hasOwnProperty.call(result.primitiveExports || {}, 'd') ? result.primitiveExports.d : null);

            await browser.close();
            if (!result.captured || !result.module44Present) process.exit(4);
          })().catch(err => {
            console.error('inspectFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node inspect-client.js
