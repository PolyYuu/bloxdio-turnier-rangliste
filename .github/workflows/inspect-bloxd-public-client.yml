name: Inspect Bloxd Public Client
on:
  push:
    paths:
      - '.github/workflows/inspect-bloxd-public-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Locate exact module 44 definition
        shell: bash
        run: |
          cat > inspect-client.js <<'JS'
          const { chromium } = require('playwright');

          function safe(text) {
            return String(text || '').replace(/[A-Za-z0-9_-]{120,}/g, '[LONG_LITERAL]');
          }

          function candidatesForModule44(text) {
            const patterns = [
              /(?:^|[,\{])44:\s*function\s*\([^)]*\)\s*\{/g,
              /(?:^|[,\{])44:\s*\([^)]*\)\s*=>\s*\{/g,
              /(?:^|[,\{])44:\s*[A-Za-z_$][\w$]*\s*=>\s*\{/g
            ];
            const hits = [];
            for (const re of patterns) {
              let m;
              while ((m = re.exec(text)) !== null) {
                const index = m.index + (m[0][0] === ',' || m[0][0] === '{' ? 1 : 0);
                hits.push(index);
                if (hits.length >= 20) return [...new Set(hits)].sort((a,b)=>a-b);
              }
            }
            return [...new Set(hits)].sort((a,b)=>a-b);
          }

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            const scripts = [];

            page.on('response', async response => {
              const req = response.request();
              const url = response.url();
              if (req.resourceType() !== 'script' && !/\.js(?:\?|$)/i.test(url)) return;
              if (!/bloxd\.io|blob:/i.test(url)) return;
              let text = '';
              try { text = await response.text(); } catch (_) { return; }
              if (text) scripts.push({ url, text });
            });

            await page.goto(`https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`, {
              waitUntil: 'domcontentloaded',
              timeout: 90000
            });
            await page.waitForTimeout(12000);

            const findings = [];
            for (const script of scripts) {
              const positions = candidatesForModule44(script.text);
              for (const pos of positions) {
                const snippet = safe(script.text.slice(Math.max(0, pos - 300), Math.min(script.text.length, pos + 5000)));
                findings.push({
                  script: script.url.split('/').pop(),
                  pos,
                  hasExportD: /\.d\([^,]+,\{[^}]*\bd\s*:/.test(snippet),
                  hasVersionWord: /version|build|client/i.test(snippet),
                  has803: /\b803\b/.test(snippet),
                  snippet
                });
              }
            }

            console.log('scriptCount=', scripts.length);
            console.log('module44CandidateCount=', findings.length);
            for (const finding of findings.slice(0, 12)) {
              console.log('MODULE44_CANDIDATE_START');
              console.log('script=', finding.script);
              console.log('pos=', finding.pos);
              console.log('hasExportD=', finding.hasExportD);
              console.log('hasVersionWord=', finding.hasVersionWord);
              console.log('has803=', finding.has803);
              console.log('snippet=', finding.snippet);
              console.log('MODULE44_CANDIDATE_END');
            }

            const likely = findings.filter(f => f.hasExportD || f.hasVersionWord || f.has803);
            console.log('likelyModule44Count=', likely.length);

            await browser.close();
            if (!findings.length) process.exit(4);
          })().catch(err => {
            console.error('inspectFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node inspect-client.js
