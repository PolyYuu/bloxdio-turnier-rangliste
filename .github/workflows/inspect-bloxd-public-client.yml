name: Inspect Bloxd Public Client
on:
  push:
    paths:
      - '.github/workflows/inspect-bloxd-public-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Resolve version export from chunk 44
        shell: bash
        run: |
          cat > inspect-client.js <<'JS'
          const { chromium } = require('playwright');

          function safe(text) {
            return String(text || '').replace(/[A-Za-z0-9_-]{120,}/g, '[LONG_LITERAL]');
          }

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            const scripts = [];

            page.on('response', async response => {
              const req = response.request();
              const url = response.url();
              if (req.resourceType() !== 'script' && !/\.js(?:\?|$)/i.test(url)) return;
              let text = '';
              try { text = await response.text(); } catch (_) { return; }
              if (text) scripts.push({ url, text });
            });

            await page.goto(`https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`, {
              waitUntil: 'domcontentloaded',
              timeout: 90000
            });
            await page.waitForTimeout(12000);

            const chunk44 = scripts.find(s => /s5187c\.44\.[^.]+\.chunk\.js(?:\?|$)/.test(s.url));
            console.log('chunk44Found=', !!chunk44);
            if (!chunk44) {
              console.log('loaded44Like=', JSON.stringify(scripts.map(s => s.url.split('/').pop()).filter(n => /\.44\./.test(n))));
              await browser.close();
              process.exit(3);
              return;
            }

            console.log('chunk44File=', chunk44.url.split('/').pop());
            console.log('chunk44Length=', chunk44.text.length);

            const text = chunk44.text;
            const exportHits = [];
            const re = /\.d\(([^,]{1,80}),\{([^}]{1,1200})\}\)/g;
            let m;
            while ((m = re.exec(text)) !== null) {
              if (!/(?:^|,)d\s*:/.test(m[2])) continue;
              exportHits.push({
                index: m.index,
                target: m[1],
                exports: m[2],
                context: safe(text.slice(Math.max(0, m.index - 1200), Math.min(text.length, m.index + 2600)))
              });
              if (exportHits.length >= 20) break;
            }

            console.log('dExportHitCount=', exportHits.length);
            for (const hit of exportHits) {
              console.log('D_EXPORT_HIT_START');
              console.log('target=', hit.target);
              console.log('exports=', safe(hit.exports));
              console.log('context=', hit.context);
              console.log('D_EXPORT_HIT_END');
            }

            // Generic scan for module wrappers near simple version/build constants.
            const numberHits = [];
            const numRe = /\b(?:7\d\d|8\d\d|9\d\d)\b/g;
            while ((m = numRe.exec(text)) !== null) {
              const ctx = safe(text.slice(Math.max(0, m.index - 500), Math.min(text.length, m.index + 500)));
              if (/version|client|build|outdated|refresh|exports|=>/.test(ctx)) {
                numberHits.push({ value: Number(m[0]), context: ctx });
                if (numberHits.length >= 30) break;
              }
            }
            console.log('chunk44NumericHints=', JSON.stringify(numberHits));

            // Print only a short beginning/end to reveal Webpack module table shape.
            console.log('chunk44Head=', safe(text.slice(0, 3000)));
            console.log('chunk44Tail=', safe(text.slice(-3000)));

            await browser.close();
          })().catch(err => {
            console.error('inspectFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node inspect-client.js
