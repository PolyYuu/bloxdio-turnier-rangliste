name: Inspect Bloxd Public Client
on:
  push:
    paths:
      - '.github/workflows/inspect-bloxd-public-client.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Resolve public client version export
        shell: bash
        run: |
          cat > inspect-client.js <<'JS'
          const { chromium } = require('playwright');

          function safeSnippet(text, start, end) {
            return text.slice(Math.max(0, start), Math.min(text.length, end))
              .replace(/[A-Za-z0-9_-]{120,}/g, '[LONG_LITERAL]');
          }

          (async () => {
            const worldId = 'HT_Y95VcEQaUBLbTc24H7';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            const scripts = [];

            page.on('response', async response => {
              const req = response.request();
              const url = response.url();
              if (req.resourceType() !== 'script' && !/\.js(?:\?|$)/i.test(url)) return;
              let text = '';
              try { text = await response.text(); } catch (_) { return; }
              if (!text) return;
              scripts.push({ url, text });
            });

            const invite = `https://bloxd.io/play/classic_playerSchematic%7C${worldId}?lobby=1`;
            await page.goto(invite, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(12000);

            console.log('scriptCount=', scripts.length);

            let joinScript = null;
            let joinPos = -1;
            for (const script of scripts) {
              const pos = script.text.indexOf('version:eQ.d');
              if (pos !== -1) {
                joinScript = script;
                joinPos = pos;
                break;
              }
            }

            if (!joinScript) {
              console.log('versionExpressionFound=false');
              await browser.close();
              process.exit(3);
              return;
            }

            console.log('versionExpressionFound=true');
            console.log('joinScript=', joinScript.url.split('/').pop());

            const before = joinScript.text.slice(Math.max(0, joinPos - 30000), joinPos);
            const importMatches = [...before.matchAll(/\beQ=EQ\((\d+)\)/g)];
            const moduleId = importMatches.length ? importMatches[importMatches.length - 1][1] : null;
            console.log('versionImportModuleId=', moduleId);
            console.log('joinContext=', safeSnippet(joinScript.text, joinPos - 1800, joinPos + 500));

            if (moduleId) {
              const moduleHints = [];
              const moduleDefPatterns = [
                new RegExp(`(?:^|[,\\{])${moduleId}:\\(?(?:function)?\\s*\\(`, 'g'),
                new RegExp(`(?:^|[,\\{])${moduleId}:`, 'g')
              ];

              for (const script of scripts) {
                for (const pattern of moduleDefPatterns) {
                  pattern.lastIndex = 0;
                  let match;
                  while ((match = pattern.exec(script.text)) !== null) {
                    moduleHints.push({
                      script: script.url.split('/').pop(),
                      snippet: safeSnippet(script.text, match.index - 300, match.index + 2500)
                    });
                    if (moduleHints.length >= 8) break;
                  }
                  if (moduleHints.length >= 8) break;
                }
                if (moduleHints.length >= 8) break;
              }

              console.log('moduleHintCount=', moduleHints.length);
              for (const hint of moduleHints) {
                console.log('VERSION_MODULE_HINT_START');
                console.log('script=', hint.script);
                console.log(hint.snippet);
                console.log('VERSION_MODULE_HINT_END');
              }
            }

            // Also search public code for likely client-version literals only when they sit near version/build exports.
            const numericHints = [];
            for (const script of scripts) {
              const re = /\b(?:7\d\d|8\d\d|9\d\d)\b/g;
              let m;
              while ((m = re.exec(script.text)) !== null) {
                const ctx = safeSnippet(script.text, m.index - 180, m.index + 180);
                if (/version|build|client|outdated|refresh/i.test(ctx)) {
                  numericHints.push({ script: script.url.split('/').pop(), value: m[0], context: ctx });
                  if (numericHints.length >= 20) break;
                }
              }
              if (numericHints.length >= 20) break;
            }
            console.log('numericVersionHints=', JSON.stringify(numericHints));

            await browser.close();
          })().catch(err => {
            console.error('inspectFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node inspect-client.js
