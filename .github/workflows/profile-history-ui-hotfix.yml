name: Profile and rating graph UI hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-history-ui-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/profile_history_ui_hotfix.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          out=Path('/tmp/hub-scripts');out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):(out/f'{i}.js').write_text(body)
          print(len(scripts))
          PY
          for f in /tmp/hub-scripts/*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Unify live profile and restore ranked rating graph'
          git push origin HEAD:main
