name: Probe Bloxd WebSocket
on:
  push:
    paths:
      - '.github/workflows/probe-bloxd-websocket.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 ws@8.18.3 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Probe nearby Bloxd client versions
        shell: bash
        run: |
          cat > websocket-version-probe.js <<'JS'
          const crypto = require('crypto');
          const WebSocket = require('ws');
          const { chromium } = require('playwright');

          const ROOM_NAME = 'classic_playerSchematic';
          const WORLD_ID = 'HT_Y95VcEQaUBLbTc24H7';
          const LANGUAGES = ['de-DE', 'de', 'en-US', 'en', 'en-Gb'];
          const VERSIONS = [803, 804, 805, 806];

          function allowedHost(host) {
            return /^(?:gs-)?[a-z0-9.-]+\.bloxd\.io(?::\d+)?$/i.test(host || '');
          }

          function decodeColyseusError(buf) {
            if (!buf || buf.length < 2 || buf[0] !== 11) return null;
            let offset = 1;
            const prefix = buf[offset++];
            let code = null;
            if (prefix < 0x80) code = prefix;
            else if (prefix === 0xcc && offset + 1 <= buf.length) code = buf.readUInt8(offset);
            else if (prefix === 0xcd && offset + 2 <= buf.length) code = buf.readUInt16LE(offset);
            else if (prefix === 0xce && offset + 4 <= buf.length) code = buf.readUInt32LE(offset);
            return { protocol: 11, errorCode: code };
          }

          async function discoverFreshHost() {
            const invite = `https://bloxd.io/play/${ROOM_NAME}%7C${WORLD_ID}?lobby=1`;
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            let discovery = null;

            page.on('response', async response => {
              if (!response.url().includes('/social/bloxd-matchmake')) return;
              try {
                const data = await response.json();
                if (data && data.succeeded === true && allowedHost(data.gameServerHost)) {
                  discovery = { host: data.gameServerHost, lobbyName: String(data.lobbyName || '1') };
                }
              } catch (_) {}
            });

            await page.goto(invite, { waitUntil: 'domcontentloaded', timeout: 90000 });
            const ua = await page.evaluate(() => navigator.userAgent);
            const deadline = Date.now() + 20000;
            while (!discovery && Date.now() < deadline) await page.waitForTimeout(200);
            await browser.close();
            if (!discovery) throw new Error('No fresh game-server host discovered');
            return { ...discovery, ua };
          }

          async function reserveSeat(host, lobbyName, ua, clientVersion) {
            const versionMatch = String(ua).match(/Chrome\/([0-9.]+)/i);
            const chromeVersion = versionMatch ? versionMatch[1] : '140.0.0.0';
            const fullLobbyName = `${WORLD_ID}|default|${lobbyName || '1'}`;
            const payload = {
              cookies: { origin: 'classic' },
              isMobile: false,
              browserInfo: {
                deviceType: 'mouseOnly',
                name: 'Chrome',
                platform: 'Linux x86_64',
                platformType: 'desktop',
                ua,
                version: chromeVersion
              },
              generalCookies: { joinDiscord: false, newGo: 'c' },
              isLoggedIn: false,
              languages: LANGUAGES,
              lobbyName: fullLobbyName,
              playSessionId: crypto.randomBytes(10).toString('base64url'),
              siteUsed: 'bloxd',
              subsiteUsed: 'bloxd',
              version: clientVersion
            };

            const response = await fetch(`https://${host}/matchmake/joinOrCreate/${ROOM_NAME}`, {
              method: 'POST',
              headers: {
                accept: 'application/json',
                'content-type': 'application/json',
                origin: 'https://bloxd.io',
                referer: 'https://bloxd.io/',
                'x-requested-with': 'XMLHttpRequest',
                'user-agent': ua
              },
              body: JSON.stringify(payload)
            });

            const text = await response.text();
            let data = null;
            try { data = JSON.parse(text); } catch (_) {}
            const room = data && data.room;
            if (!response.ok || !room || !room.roomId || !room.processId || !data.sessionId) {
              return {
                ok: false,
                status: response.status,
                code: data && data.code != null ? data.code : null,
                error: data && (data.error || data.message) || null
              };
            }

            return {
              ok: true,
              roomId: room.roomId,
              processId: room.processId,
              sessionId: data.sessionId,
              publicAddress: typeof room.publicAddress === 'string' ? room.publicAddress.trim() : ''
            };
          }

          function consumeReservation(discoveryHost, reservation, ua) {
            return new Promise((resolve) => {
              const host = reservation.publicAddress || discoveryHost;
              const endpoint = `wss://${host}/${encodeURIComponent(reservation.processId)}/${encodeURIComponent(reservation.roomId)}?sessionId=${encodeURIComponent(reservation.sessionId)}`;
              const result = {
                opened: false,
                firstByte: null,
                firstFrameHex: null,
                errorCode: null,
                closeCode: null,
                socketError: null
              };
              let settled = false;
              const finish = () => {
                if (settled) return;
                settled = true;
                try { ws.close(); } catch (_) {}
                resolve(result);
              };

              const ws = new WebSocket(endpoint, {
                origin: 'https://bloxd.io',
                headers: { 'User-Agent': ua },
                handshakeTimeout: 10000
              });

              const timer = setTimeout(finish, 7000);
              ws.on('open', () => { result.opened = true; });
              ws.on('message', data => {
                const buf = Buffer.isBuffer(data) ? data : Buffer.from(data);
                result.firstByte = buf.length ? buf[0] : null;
                result.firstFrameHex = buf.subarray(0, 32).toString('hex');
                const decoded = decodeColyseusError(buf);
                result.errorCode = decoded && decoded.errorCode;
                clearTimeout(timer);
                setTimeout(finish, 100);
              });
              ws.on('close', code => {
                result.closeCode = code;
                clearTimeout(timer);
                finish();
              });
              ws.on('error', err => {
                result.socketError = String(err && err.message || err);
                clearTimeout(timer);
                finish();
              });
            });
          }

          (async () => {
            const discovery = await discoverFreshHost();
            console.log('freshHostDiscovered=', true);

            let winningVersion = null;
            const results = [];

            for (const version of VERSIONS) {
              const reservation = await reserveSeat(discovery.host, discovery.lobbyName, discovery.ua, version);
              if (!reservation.ok) {
                const row = { version, reservationOk: false, httpStatus: reservation.status, code: reservation.code };
                results.push(row);
                console.log('versionProbe=', JSON.stringify(row));
                continue;
              }

              const socket = await consumeReservation(discovery.host, reservation, discovery.ua);
              const row = {
                version,
                reservationOk: true,
                socketOpened: socket.opened,
                firstByte: socket.firstByte,
                errorCode: socket.errorCode,
                closeCode: socket.closeCode,
                firstFrameHex: socket.firstFrameHex
              };
              results.push(row);
              console.log('versionProbe=', JSON.stringify(row));

              if (socket.firstByte === 10) {
                winningVersion = version;
                break;
              }
            }

            console.log('versionProbeSummary=', JSON.stringify(results));
            console.log('BLOXD_CURRENT_CLIENT_VERSION=', winningVersion);

            if (!winningVersion) process.exit(5);
          })().catch(err => {
            console.error('probeFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node websocket-version-probe.js
