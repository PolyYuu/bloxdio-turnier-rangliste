name: Probe Bloxd WebSocket
on:
  push:
    paths:
      - '.github/workflows/probe-bloxd-websocket.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 ws@8.18.3 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Discover, reserve and diagnose WebSocket
        shell: bash
        run: |
          cat > websocket-probe.js <<'JS'
          const crypto = require('crypto');
          const WebSocket = require('ws');
          const { chromium } = require('playwright');

          const ROOM_NAME = 'classic_playerSchematic';
          const WORLD_ID = 'HT_Y95VcEQaUBLbTc24H7';
          const LANGUAGES = ['de-DE', 'de', 'en-US', 'en', 'en-Gb'];

          function allowedHost(host) {
            return /^(?:gs-)?[a-z0-9.-]+\.bloxd\.io(?::\d+)?$/i.test(host || '');
          }

          function decodeMsgpackNumber(buf, offset) {
            if (offset >= buf.length) return null;
            const b = buf[offset++];
            if (b <= 0x7f) return { value: b, offset };
            if (b >= 0xe0) return { value: b - 256, offset };
            if (b === 0xcc && offset + 1 <= buf.length) return { value: buf.readUInt8(offset), offset: offset + 1 };
            if (b === 0xcd && offset + 2 <= buf.length) return { value: buf.readUInt16BE(offset), offset: offset + 2 };
            if (b === 0xce && offset + 4 <= buf.length) return { value: buf.readUInt32BE(offset), offset: offset + 4 };
            if (b === 0xd0 && offset + 1 <= buf.length) return { value: buf.readInt8(offset), offset: offset + 1 };
            if (b === 0xd1 && offset + 2 <= buf.length) return { value: buf.readInt16BE(offset), offset: offset + 2 };
            if (b === 0xd2 && offset + 4 <= buf.length) return { value: buf.readInt32BE(offset), offset: offset + 4 };
            return null;
          }

          function decodeMsgpackString(buf, offset) {
            if (offset >= buf.length) return null;
            const b = buf[offset++];
            let len = null;
            if ((b & 0xe0) === 0xa0) len = b & 0x1f;
            else if (b === 0xd9 && offset + 1 <= buf.length) { len = buf.readUInt8(offset); offset += 1; }
            else if (b === 0xda && offset + 2 <= buf.length) { len = buf.readUInt16BE(offset); offset += 2; }
            if (len == null || offset + len > buf.length) return null;
            return { value: buf.subarray(offset, offset + len).toString('utf8'), offset: offset + len };
          }

          function decodeColyseusError(buf) {
            if (!buf || buf.length < 2 || buf[0] !== 11) return null;
            const number = decodeMsgpackNumber(buf, 1);
            if (!number) return { protocol: 11, errorCode: null, message: null };
            const str = decodeMsgpackString(buf, number.offset);
            return {
              protocol: 11,
              errorCode: number.value,
              message: str ? str.value : null
            };
          }

          async function discoverFreshHost() {
            const invite = `https://bloxd.io/play/${ROOM_NAME}%7C${WORLD_ID}?lobby=1`;
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'de-DE' });
            const page = await context.newPage();
            let discovery = null;

            page.on('response', async response => {
              if (!response.url().includes('/social/bloxd-matchmake')) return;
              try {
                const data = await response.json();
                if (data && data.succeeded === true && allowedHost(data.gameServerHost)) {
                  discovery = { host: data.gameServerHost, lobbyName: String(data.lobbyName || '1') };
                }
              } catch (_) {}
            });

            await page.goto(invite, { waitUntil: 'domcontentloaded', timeout: 90000 });
            const ua = await page.evaluate(() => navigator.userAgent);
            const deadline = Date.now() + 20000;
            while (!discovery && Date.now() < deadline) await page.waitForTimeout(200);
            await browser.close();
            if (!discovery) throw new Error('No fresh game-server host discovered');
            return { ...discovery, ua };
          }

          async function reserveSeat(host, lobbyName, ua) {
            const versionMatch = String(ua).match(/Chrome\/([0-9.]+)/i);
            const chromeVersion = versionMatch ? versionMatch[1] : '140.0.0.0';
            const fullLobbyName = `${WORLD_ID}|default|${lobbyName || '1'}`;
            const payload = {
              cookies: { origin: 'classic' },
              isMobile: false,
              browserInfo: {
                deviceType: 'mouseOnly', name: 'Chrome', platform: 'Linux x86_64',
                platformType: 'desktop', ua, version: chromeVersion
              },
              generalCookies: { joinDiscord: false, newGo: 'c' },
              isLoggedIn: false,
              languages: LANGUAGES,
              lobbyName: fullLobbyName,
              playSessionId: crypto.randomBytes(10).toString('base64url'),
              siteUsed: 'bloxd',
              subsiteUsed: 'bloxd',
              version: 803
            };

            const response = await fetch(`https://${host}/matchmake/joinOrCreate/${ROOM_NAME}`, {
              method: 'POST',
              headers: {
                accept: 'application/json',
                'content-type': 'application/json',
                origin: 'https://bloxd.io',
                referer: 'https://bloxd.io/',
                'x-requested-with': 'XMLHttpRequest',
                'user-agent': ua
              },
              body: JSON.stringify(payload)
            });

            const data = await response.json();
            const room = data && data.room;
            if (!response.ok || !room || !room.roomId || !room.processId || !data.sessionId) {
              throw new Error(`Seat reservation failed: HTTP ${response.status}`);
            }
            return {
              roomId: room.roomId,
              processId: room.processId,
              sessionId: data.sessionId,
              publicAddress: typeof room.publicAddress === 'string' ? room.publicAddress.trim() : '',
              roomName: room.name || ROOM_NAME,
              lobbyName: room.lobbyName || fullLobbyName
            };
          }

          function openSocket(discoveryHost, reservation, ua) {
            return new Promise((resolve, reject) => {
              const requestedHost = reservation.publicAddress || discoveryHost;
              if (!allowedHost(requestedHost)) throw new Error('Reservation returned non-Bloxd publicAddress');
              const endpoint = `wss://${requestedHost}/${encodeURIComponent(reservation.processId)}/${encodeURIComponent(reservation.roomId)}?sessionId=${encodeURIComponent(reservation.sessionId)}`;
              const summary = {
                opened: false, messages: 0, binaryMessages: 0, textMessages: 0,
                totalBytes: 0, firstMessageBytes: null, firstByte: null,
                firstFrameHex: null, protocolError: null,
                usedPublicAddress: !!reservation.publicAddress,
                closeCode: null, closeReasonLength: null, error: null
              };

              const ws = new WebSocket(endpoint, {
                origin: 'https://bloxd.io',
                headers: { 'User-Agent': ua, 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' },
                handshakeTimeout: 15000
              });

              const timeout = setTimeout(() => {
                try { ws.close(1000, 'probe complete'); } catch (_) {}
                resolve(summary);
              }, 10000);

              ws.on('open', () => {
                summary.opened = true;
                console.log('WEBSOCKET_OPEN=true');
              });

              ws.on('message', (data, isBinary) => {
                const buf = Buffer.isBuffer(data) ? data : Buffer.from(data);
                summary.messages++;
                if (isBinary) summary.binaryMessages++; else summary.textMessages++;
                summary.totalBytes += buf.length;
                if (summary.firstMessageBytes == null) {
                  summary.firstMessageBytes = buf.length;
                  summary.firstByte = buf.length ? buf[0] : null;
                  summary.firstFrameHex = buf.subarray(0, 64).toString('hex');
                  summary.protocolError = decodeColyseusError(buf);
                }
                if (summary.messages >= 5) {
                  clearTimeout(timeout);
                  try { ws.close(1000, 'probe complete'); } catch (_) {}
                  setTimeout(() => resolve(summary), 300);
                }
              });

              ws.on('close', (code, reason) => {
                summary.closeCode = code;
                summary.closeReasonLength = reason ? reason.length : 0;
                if (summary.opened) {
                  clearTimeout(timeout);
                  resolve(summary);
                }
              });

              ws.on('error', err => {
                summary.error = String(err && err.message || err);
                if (!summary.opened) {
                  clearTimeout(timeout);
                  reject(new Error(summary.error));
                }
              });
            });
          }

          (async () => {
            const discovery = await discoverFreshHost();
            console.log('freshHostDiscovered=', true);

            const reservation = await reserveSeat(discovery.host, discovery.lobbyName, discovery.ua);
            console.log('reservationOk=', true);
            console.log('publicAddressPresent=', !!reservation.publicAddress);
            console.log('publicAddressAllowed=', reservation.publicAddress ? allowedHost(reservation.publicAddress) : null);

            const socket = await openSocket(discovery.host, reservation, discovery.ua);
            console.log('websocketSummary=', JSON.stringify(socket));

            const joined = socket.opened && socket.messages > 0 && socket.firstByte === 10;
            console.log('BLOXD_COLYSEUS_JOIN_FRAME=', joined);
            if (!socket.opened || !socket.messages) process.exit(4);
          })().catch(err => {
            console.error('probeFatal=', String(err && err.stack || err));
            process.exit(9);
          });
          JS

          node websocket-probe.js
