name: Catch-up modal registration v2 fix
on:
  push:
    paths:
      - '.github/scripts/fix_catchup_modal_registration_v2.py'
      - '.github/workflows/catchup-modal-registration-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/fix_catchup_modal_registration_v2.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import subprocess, tempfile
          soup=BeautifulSoup(Path('index.html').read_text(),'html.parser')
          for i,s in enumerate(soup.find_all('script')):
              if s.get('src'): continue
              js=s.string if s.string is not None else s.get_text()
              if not js.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False)
              f.write(js);f.close()
              subprocess.run(['node','--check',f.name],check=True)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Fix catch-up modal closing and registration export"
          git push
