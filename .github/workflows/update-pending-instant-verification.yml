name: Refresh Pending instant verification card

on:
  push:
    paths:
      - '.github/workflows/update-pending-instant-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Pending verification card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pending-hub.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing patch target: {label}')
              text = text.replace(old, new, 1)

          replace_once(
          """      bridgeEyebrow:'AUTOMATIC VERIFICATION', bridgeTitle:'HUB Verify Extension', bridgeBadge:'TESTING',
      bridgeText:'HUB Verify detects the verification data directly in Bloxd and sends it automatically to the HUB. You do not need to copy or enter a code manually.',
      bridgeStep1:'Install the HUB Verify Extension', bridgeStep2:'Open the HUB / tournament lobby in Bloxd', bridgeStep3:'Verification runs automatically in the background',
      bridgeButton:'EXTENSION NOT PUBLIC YET', bridgeNote:'The technical connection already works. Before public release, the complete verification flow is being tested once more with a fresh Pending account.',""",
          """      bridgeEyebrow:'INSTANT VERIFICATION', bridgeTitle:'Verify your account right now?', bridgeBadge:'GOOGLE CHROME',
      bridgeText:'If you do not want to wait for an admin to unlock your account, you can verify it yourself immediately. Install HUB Verify and open Bloxd.io once in Google Chrome. After a few seconds, the extension detects your verification data and confirms your account automatically. HUB Verify acts as a secure bridge between Bloxd.io and the HUB so we can confirm that the Bloxd account really belongs to you.',
      bridgeBrowser:'Google Chrome is currently recommended. Microsoft Edge and Brave are Chromium-based and can generally load Chrome extensions too, but HUB Verify has not been officially tested there yet.',
      bridgeTutorial:'VIEW TUTORIAL', bridgeDownload:'DOWNLOAD EXTENSION', bridgeOpenBloxd:'OPEN BLOXD.IO',
      bridgeNote:'After successful verification, your Pending account is unlocked automatically.',""",
          'English bridge copy')

          replace_once(
          """      bridgeEyebrow:'AUTOMATISCHE VERIFIZIERUNG', bridgeTitle:'HUB Verify Extension', bridgeBadge:'TESTPHASE',
      bridgeText:'HUB Verify erkennt die Verifizierungsdaten direkt in Bloxd und überträgt sie automatisch an den HUB. Du musst keinen Code manuell kopieren oder eingeben.',
      bridgeStep1:'HUB Verify Extension installieren', bridgeStep2:'HUB-/Turnierlobby in Bloxd öffnen', bridgeStep3:'Verifizierung läuft automatisch im Hintergrund',
      bridgeButton:'EXTENSION NOCH NICHT FREIGEGEBEN', bridgeNote:'Die technische Verbindung funktioniert bereits. Vor der öffentlichen Freigabe testen wir den kompletten Ablauf noch einmal mit einem frischen Pending-Account.',""",
          """      bridgeEyebrow:'SOFORT VERIFIZIEREN', bridgeTitle:'Jetzt sofort verifizieren?', bridgeBadge:'GOOGLE CHROME',
      bridgeText:'Wenn du nicht auf die Freigabe durch einen Admin warten möchtest, kannst du deinen Account sofort selbst verifizieren. Installiere dafür HUB Verify und öffne Bloxd.io einmal in Google Chrome. Nach wenigen Sekunden erkennt die Extension deine Verifizierungsdaten und bestätigt deinen Account automatisch. HUB Verify dient dabei als sichere Brücke zwischen Bloxd.io und dem HUB, damit wir bestätigen können, dass der Bloxd-Account wirklich zu dir gehört.',
      bridgeBrowser:'Aktuell empfehlen wir Google Chrome. Microsoft Edge und Brave basieren ebenfalls auf Chromium und können Chrome-Extensions grundsätzlich laden, HUB Verify wird dort aber noch separat getestet.',
      bridgeTutorial:'TUTORIAL ANSEHEN', bridgeDownload:'EXTENSION HERUNTERLADEN', bridgeOpenBloxd:'BLOXD.IO ÖFFNEN',
      bridgeNote:'Nach erfolgreicher Verifizierung wird dein Pending-Account automatisch freigeschaltet.',""",
          'German bridge copy')

          replace_once(
          """      bridgeEyebrow:'VÉRIFICATION AUTOMATIQUE', bridgeTitle:'HUB Verify Extension', bridgeBadge:'PHASE DE TEST',
      bridgeText:'HUB Verify détecte les données de vérification directement dans Bloxd et les transmet automatiquement au HUB. Aucun code ne doit être copié ou saisi manuellement.',
      bridgeStep1:'Installer HUB Verify Extension', bridgeStep2:'Ouvrir le lobby HUB / tournoi dans Bloxd', bridgeStep3:'La vérification se fait automatiquement en arrière-plan',
      bridgeButton:'EXTENSION PAS ENCORE PUBLIQUE', bridgeNote:'La connexion technique fonctionne déjà. Avant la publication, nous testons encore une fois le processus complet avec un nouveau compte en attente.',""",
          """      bridgeEyebrow:'VÉRIFICATION IMMÉDIATE', bridgeTitle:'Te vérifier maintenant ?', bridgeBadge:'GOOGLE CHROME',
      bridgeText:'Si tu ne veux pas attendre la validation par un administrateur, tu peux vérifier ton compte immédiatement. Installe HUB Verify puis ouvre Bloxd.io une fois dans Google Chrome. Après quelques secondes, l’extension détecte les données de vérification et confirme automatiquement ton compte. HUB Verify sert de pont sécurisé entre Bloxd.io et le HUB afin de confirmer que le compte Bloxd t’appartient vraiment.',
      bridgeBrowser:'Google Chrome est actuellement recommandé. Microsoft Edge et Brave utilisent aussi Chromium et peuvent généralement charger les extensions Chrome, mais HUB Verify n’y a pas encore été testé officiellement.',
      bridgeTutorial:'VOIR LE TUTORIEL', bridgeDownload:'TÉLÉCHARGER L’EXTENSION', bridgeOpenBloxd:'OUVRIR BLOXD.IO',
      bridgeNote:'Après la vérification, ton compte en attente est débloqué automatiquement.',""",
          'French bridge copy')

          old_html = """          <span class=\"eyebrow teal\">${t('bridgeEyebrow')}</span>
          <h2>${t('bridgeTitle')}</h2>
          <span class=\"hub-pending-bridge-badge\">${t('bridgeBadge')}</span>
          <p>${t('bridgeText')}</p>
          <div class=\"hub-pending-route-steps\">
            <div><b>1</b><span>${t('bridgeStep1')}</span></div>
            <div><b>2</b><span>${t('bridgeStep2')}</span></div>
            <div><b>3</b><span>${t('bridgeStep3')}</span></div>
          </div>
          <button type=\"button\" class=\"secondary-button\" disabled>${t('bridgeButton')}</button>
          <p>${t('bridgeNote')}</p>"""

          new_html = """          <span class=\"eyebrow teal\">${t('bridgeEyebrow')}</span>
          <h2>${t('bridgeTitle')}</h2>
          <span class=\"hub-pending-bridge-badge\">${t('bridgeBadge')}</span>
          <p>${t('bridgeText')}</p>
          <p class=\"hub-pending-browser-note\">${t('bridgeBrowser')}</p>
          <div class=\"hub-pending-verify-actions\">
            <button type=\"button\" class=\"hub-pending-verify-button hub-pending-verify-button-muted\" data-hub-verify-tutorial>${t('bridgeTutorial')}</button>
            <a class=\"hub-pending-verify-button hub-pending-verify-button-primary\" href=\"/downloads/HUB-Verify-v1.0.1.zip\" download>${t('bridgeDownload')}</a>
            <a class=\"hub-pending-verify-button hub-pending-verify-button-bloxd\" href=\"https://bloxd.io/\" target=\"_blank\" rel=\"noopener noreferrer\">${t('bridgeOpenBloxd')}</a>
          </div>
          <p class=\"hub-pending-route-note\">${t('bridgeNote')}</p>"""
          replace_once(old_html, new_html, 'verification card markup')

          css_anchor = """      .hub-pending-bridge-badge{display:inline-flex;width:max-content;margin:4px 0 12px;padding:7px 10px;border:1px solid rgba(244,189,79,.3);border-radius:999px;background:rgba(244,189,79,.1);color:#f4bd4f;font-size:8px;font-weight:900;letter-spacing:.08em}
"""
          css_extra = """      .hub-pending-bridge-badge{display:inline-flex;width:max-content;margin:4px 0 12px;padding:7px 10px;border:1px solid rgba(56,240,219,.28);border-radius:999px;background:rgba(56,240,219,.08);color:#59ead9;font-size:8px;font-weight:900;letter-spacing:.08em}
      .hub-pending-browser-note{margin:15px 0 0!important;padding:11px 13px;border:1px solid rgba(255,255,255,.055);border-radius:11px;background:rgba(255,255,255,.025);color:#8f86a4!important;font-size:10.5px!important;line-height:1.55!important}
      .hub-pending-verify-actions{display:grid;grid-template-columns:.9fr 1.25fr 1fr;gap:9px;margin:19px 0 2px}
      .hub-pending-verify-button{display:flex;align-items:center;justify-content:center;min-height:45px;padding:0 14px;border:1px solid rgba(126,79,241,.55);border-radius:10px;background:rgba(126,79,241,.08);color:#f7f4ff;font:900 9px/1.15 Montserrat,Arial;letter-spacing:.045em;text-align:center;text-decoration:none;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease}
      .hub-pending-verify-button:hover{transform:translateY(-1px);border-color:rgba(151,108,255,.9);background:rgba(126,79,241,.15)}
      .hub-pending-verify-button-primary{border-color:rgba(56,240,219,.48);background:linear-gradient(135deg,rgba(56,240,219,.20),rgba(71,186,255,.15));color:#dffffb;box-shadow:0 10px 28px rgba(20,207,190,.08)}
      .hub-pending-verify-button-primary:hover{border-color:rgba(56,240,219,.82);background:linear-gradient(135deg,rgba(56,240,219,.28),rgba(71,186,255,.20));box-shadow:0 12px 32px rgba(20,207,190,.13)}
      .hub-pending-verify-button-bloxd{border-color:rgba(255,255,255,.10);background:rgba(255,255,255,.045)}
      .hub-pending-verify-button-muted{border-color:rgba(126,79,241,.36);background:rgba(126,79,241,.07)}
"""
          replace_once(css_anchor, css_extra, 'verification card styles')

          mobile_anchor = """      @media(max-width:900px){.hub-pending-route-grid{grid-template-columns:1fr}}
"""
          mobile_new = """      @media(max-width:900px){.hub-pending-route-grid{grid-template-columns:1fr}.hub-pending-verify-actions{grid-template-columns:1fr 1fr}.hub-pending-verify-button-bloxd{grid-column:1/-1}}
"""
          replace_once(mobile_anchor, mobile_new, 'verification responsive styles')

          tiny_anchor = """      @media(max-width:480px){.hub-pending-route-actions{display:grid}.hub-pending-route-actions button{width:100%}.hub-pending-route-code>strong{font-size:22px;letter-spacing:.14em}}
"""
          tiny_new = """      @media(max-width:480px){.hub-pending-route-actions{display:grid}.hub-pending-route-actions button{width:100%}.hub-pending-route-code>strong{font-size:22px;letter-spacing:.14em}.hub-pending-verify-actions{grid-template-columns:1fr}.hub-pending-verify-button-bloxd{grid-column:auto}}
"""
          replace_once(tiny_anchor, tiny_new, 'verification mobile styles')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build validated extension download
        run: |
          mkdir -p downloads
          rm -f downloads/HUB-Verify-v1.0.1.zip
          cd extension/hub-verify
          zip -qr ../../downloads/HUB-Verify-v1.0.1.zip .

      - name: Validate JavaScript
        run: node --check pending-hub.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending-hub.js downloads/HUB-Verify-v1.0.1.zip
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Redesign Pending instant verification"
          git push
